schema_version: 1
checked_at: "2026-09-04"
scope: "Public OpenAI documentation used by Oxrail v0.1"
rules:
  - "A public Codex contract does not establish the same behavior in ChatGPT Work or ChatGPT Web."
  - "Documentation proves availability and schema only; the installed host route still requires a version-bound probe."

records:
  - id: EVID-OAI-001
    alias: OAI-HOOKS
    status: PUBLIC_CONTRACT
    url: https://learn.chatgpt.com/docs/hooks
    supports:
      - "Hooks are a Codex extensibility framework."
      - "PreToolUse and PostToolUse cover supported local function and MCP tool paths."
      - "Non-managed hooks must be reviewed and trusted; trust follows the current definition hash."
      - "Plugin hooks remain skipped until the user trusts the current definition."
    does_not_support:
      - "Automatic Hook trust during plugin installation."
      - "A claim that every specialized or hosted Computer Use path traverses hooks."
      - "A ChatGPT Web lifecycle-hook claim."
    applied_to:
      - REQ-HOST-007
      - REQ-HOST-009
      - REQ-HOST-011

  - id: EVID-OAI-002
    alias: OAI-PLUGINS
    status: PUBLIC_CONTRACT
    url: https://learn.chatgpt.com/docs/plugins
    supports:
      - "Plugins can bundle skills and lifecycle hooks."
      - "Codex CLI exposes a plugin browser and installed capabilities load in a new session."
      - "Supported plugin surfaces and the IDE limitation are documented."
    does_not_support:
      - "Every plugin component running on every ChatGPT and Codex surface."
      - "A repository marketplace being equivalent to universal public-directory publication."

  - id: EVID-OAI-003
    alias: OAI-PLUGIN-BUILD
    status: PUBLIC_CONTRACT
    url: https://developers.openai.com/plugins/build/plugins
    supports:
      - "The .codex-plugin/plugin.json manifest, skills directory, hooks/hooks.json, and marketplace structure."
      - "Git-backed marketplace sources and plugin-bundled hook environment variables."
      - "Installing or enabling a plugin does not automatically trust bundled hooks."
    does_not_support:
      - "Bypassing the host Hook review flow."

  - id: EVID-OAI-004
    alias: OAI-COMPUTER-USE
    status: PUBLIC_CONTRACT
    url: https://learn.chatgpt.com/docs/computer-use
    supports:
      - "Computer Use is installed and enabled separately in supported ChatGPT desktop surfaces."
      - "Computer Use operates graphical interfaces and remains subject to app permissions and approvals."
    does_not_support:
      - "Oxrail visibility into the Computer Use tool route."
      - "Per-primitive public Hook granularity."

  - id: EVID-OAI-005
    alias: OAI-CHROME-EXT
    status: PUBLIC_CONTRACT
    url: https://learn.chatgpt.com/docs/chrome-extension
    supports:
      - "The ChatGPT browser extension can use the user's supported real browser and signed-in tabs."
      - "Browser installation, website permissions, and app controls are user-reviewed host settings."
    does_not_support:
      - "Oxrail same-tab Handoff, exclusive lease, or automatic resume."

  - id: EVID-OAI-006
    alias: OAI-WEBMCP
    status: PUBLIC_CONTRACT
    url: https://learn.chatgpt.com/docs/webmcp
    supports:
      - "Structured site tools can be a native-first route where available."
    does_not_support:
      - "Availability on every site or surface."

  - id: EVID-OAI-007
    alias: OAI-CHANGELOG
    status: PUBLIC_CONTRACT
    url: https://learn.chatgpt.com/docs/changelog
    supports:
      - "Version-specific host changes must be rechecked before updating a compatibility profile."
    freshness: "Recheck for each release and host-profile renewal."

  - id: EVID-OAI-010
    alias: OAI-CHATGPT-UI
    status: PUBLIC_CONTRACT
    url: https://developers.openai.com/plugins/build/chatgpt-ui
    supports:
      - "Plugins may provide an optional app/UI surface."
    does_not_support:
      - "Embedding or controlling the exact real Chrome tab."

  - id: EVID-OAI-011
    alias: OAI-DEVELOPER-COMMANDS
    status: PUBLIC_CONTRACT
    url: https://learn.chatgpt.com/docs/developer-commands
    supports:
      - "codex plugin marketplace add accepts GitHub owner/repo shorthand."
      - "codex plugin add accepts plugin@marketplace."
    release_commands:
      - "codex plugin marketplace add regrevia/Oxrail"
      - "codex plugin add oxrail@oxrail"

probe_required:
  - "Actual Chrome Computer Use PreToolUse/PostToolUse route visibility."
  - "Matcher names, coverage, action granularity, and bypass behavior."
  - "Native interaction fidelity with Oxrail enabled."
  - "Safety/Handoff capabilities and their current activation."
