    <!--
      Just enough prose to stay under the character budget, and more controls
      than one reading will number, so the controls ceiling is the first thing
      this page hits. Synthetic on purpose: the point is that a page can be
      short and still not readable in one numbered pass.
    -->
    <h1>Watering schedule</h1>
    <p>
      One row per bed. Each row has a button that opens that bed for editing.
      The page is short on purpose: what it is long on is controls, and the
      budget a reading may spend on naming them.
    </p>
    <h2>Delivery</h2>
    <p id="delivery-status" hidden>Dispatched this morning.</p>
    <button
      type="button"
      onclick="document.getElementById(&#39;delivery-status&#39;).hidden = false"
    >
      Show delivery status
    </button>
